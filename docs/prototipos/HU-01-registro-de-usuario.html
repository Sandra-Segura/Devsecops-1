<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=1280"><title>HU-01 Registro de usuario</title><style>*{box-sizing:border-box;margin:0}body{width:1280px;height:720px;overflow:hidden;font-family:'Noto Sans','Segoe UI',Arial,sans-serif;background:#f0f5fd;color:#1a1a1a}
.bar{height:64px;background:#f7f7f7;border-bottom:2px solid #b0b0b0;display:flex;align-items:center;padding:0 28px;gap:20px}
.url{flex:1;background:#fff;border:2px solid #b0b0b0;border-radius:24px;padding:8px 22px;font-size:22px;color:#595959}
.tag{background:#fff6b6;color:#af7e04;font-weight:700;font-size:20px;border-radius:20px;padding:6px 18px}
.card{width:780px;margin:24px auto 0;background:#fff;border:2px solid #b0b0b0;border-radius:16px;padding:26px 40px}
h1{font-size:38px;margin-bottom:16px}label{display:block;font-weight:700;font-size:22px;margin-bottom:6px}
.in{border:2px solid #b0b0b0;border-radius:10px;padding:9px 16px;font-size:24px;color:#595959;margin-bottom:14px}
.btn{background:#c6dcff;color:#305bab;font-weight:700;font-size:26px;text-align:center;border-radius:14px;padding:12px;margin:6px 0 14px}
a{display:block;color:#305bab;font-size:22px;margin-bottom:12px}
.msg{border-radius:10px;padding:12px 18px;font-size:22px;margin-bottom:14px}.err{background:#fff0f0;color:#bd0a0a}.ok{background:#eaf9ef;color:#067429}
.row{background:#f0f5fd;color:#595959;border-radius:10px;padding:12px 18px;font-size:22px;margin-bottom:10px}</style></head>
<body><div class="bar"><span class="tag">HU-01</span><div class="url">app.ejemplo.com/registro</div></div>
<div class="card"><h1>Crear cuenta</h1><label>Correo</label><div class="in">nombre@empresa.com</div><label>Contraseña</label><div class="in">Mínimo 12 caracteres</div><div class="msg err">No se pudo completar el registro</div><div class="btn">Registrarme</div><a>¿Ya tienes cuenta? Inicia sesión</a></div></body></html>
